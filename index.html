<title>Talent Workbench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ============ TOKENS — shared with the Governance module system ============ */
:root{
  --paper:#f6f7f4; --surface:#ffffff; --surface-2:#eef1ec;
  --ink:#1a2420; --ink-soft:#5c675f; --ink-faint:#8b968d;
  --line:#e1e5df; --line-strong:#cfd6cb;
  --accent:#155349; --accent-ink:#0d3a33; --accent-soft:#e5eeea; --accent-line:rgba(21,83,73,.35);
  --warm:#6f5aa8; --warm-ink:#4a3b73; --warm-soft:#ece7f6; --warm-line:rgba(111,90,168,.35);
  --success:#2f9e63; --success-soft:#e5f5ec;
  --warning:#c67a2a; --warning-soft:#faeedd;
  --critical:#c8493b; --critical-soft:#fae7e4;
  --info:#3d6fa8; --info-soft:#e6eef7;
  --radius:12px; --radius-sm:8px;
  --font-display:'Manrope',system-ui,sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow-card:0 1px 2px rgba(20,30,25,.04), 0 4px 14px rgba(20,30,25,.05);
  --shadow-pop:0 12px 32px -8px rgba(18,30,26,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121613; --surface:#181d19; --surface-2:#1e2420;
    --ink:#e9ede9; --ink-soft:#a7b1a7; --ink-faint:#727d73;
    --line:#2a322c; --line-strong:#3a453d;
    --accent:#5fb3a1; --accent-ink:#8fd0c0; --accent-soft:#1c2e2a; --accent-line:rgba(95,179,161,.4);
    --warm:#a996d6; --warm-ink:#c9bcec; --warm-soft:#2a2440; --warm-line:rgba(169,150,214,.4);
    --success:#4cb87c; --success-soft:#173325;
    --warning:#d99a4f; --warning-soft:#332617;
    --critical:#e07564; --critical-soft:#33201c;
    --info:#7fa8d6; --info-soft:#1c2632;
    --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
    --shadow-pop:0 12px 32px -8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#121613; --surface:#181d19; --surface-2:#1e2420;
  --ink:#e9ede9; --ink-soft:#a7b1a7; --ink-faint:#727d73;
  --line:#2a322c; --line-strong:#3a453d;
  --accent:#5fb3a1; --accent-ink:#8fd0c0; --accent-soft:#1c2e2a; --accent-line:rgba(95,179,161,.4);
  --warm:#a996d6; --warm-ink:#c9bcec; --warm-soft:#2a2440; --warm-line:rgba(169,150,214,.4);
  --success:#4cb87c; --success-soft:#173325;
  --warning:#d99a4f; --warning-soft:#332617;
  --critical:#e07564; --critical-soft:#33201c;
  --info:#7fa8d6; --info-soft:#1c2632;
  --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
  --shadow-pop:0 12px 32px -8px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:800;margin:0;text-wrap:balance;color:var(--ink);}
p{margin:0;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font-body);}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.scrollx{overflow-x:auto;}
table{border-collapse:collapse;width:100%;}
svg.icon{width:18px;height:18px;flex-shrink:0;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============ SHELL ============ */
#app{display:grid;grid-template-columns:226px 1fr;min-height:100vh;max-width:1440px;margin:0 auto;}
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:15px;flex:none;}
.brand-text .b1{font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--ink);line-height:1.2;}
.brand-text .b2{font-size:11px;color:var(--ink-faint);}
.nav-group{display:flex;flex-direction:column;gap:2px;}
.nav-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);padding:8px 10px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-soft);font-size:13.5px;font-weight:600;cursor:pointer;width:100%;border:none;background:none;}
.nav-item:hover{background:var(--surface-2);color:var(--ink);}
.nav-item.active{background:var(--accent-soft);color:var(--accent-ink);}
.nav-item .ic{display:flex;flex:none;color:inherit;opacity:.9;}
.nav-item .ic svg{width:18px;height:18px;}
.nav-count{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;font-weight:700;background:var(--surface-2);padding:1px 7px;border-radius:20px;color:var(--ink-faint);}
.nav-item.active .nav-count{background:rgba(255,255,255,.5);color:var(--accent-ink);}
.sidebar-foot{margin-top:auto;padding:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-faint);line-height:1.5;}

.main{min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.topbar h1{font-size:16.5px;}
.client-chip{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:20px;background:var(--surface-2);font-size:12.5px;font-weight:700;color:var(--ink);border:1px solid var(--line);}
.client-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex:none;}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-faint);flex:none;min-width:0;overflow-x:auto;white-space:nowrap;padding:10px 28px 0;}
.crumbs button{background:none;border:none;padding:0;font-family:var(--font-body);font-size:12.5px;color:var(--ink-faint);cursor:pointer;font-weight:600;}
.crumbs button:hover{color:var(--accent);text-decoration:underline;}
.crumbs .current{color:var(--ink);font-weight:600;}
.crumbs .sep{color:var(--line-strong);}
.topbar-tools{display:flex;align-items:center;gap:14px;margin-left:auto;}
.role-pick{display:flex;flex-direction:column;gap:2px;}
.role-pick .rp-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);display:flex;align-items:center;gap:5px;padding-left:2px;}
.role-pick select{font-family:var(--font-body);font-weight:600;font-size:12.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 26px 6px 10px;cursor:pointer;}
.info-dot{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:var(--surface-2);color:var(--ink-faint);font-size:9px;font-weight:800;font-family:var(--font-mono);border:1px solid var(--line);cursor:help;flex:none;}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--ink-soft);}
.icon-btn:hover{background:var(--surface-2);}
.dot-flag{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--critical);border:1.5px solid var(--surface);}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:12.5px;flex:none;}
.content{padding:22px 28px 70px;max-width:1180px;width:100%;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap;}
.page-head h1{font-size:23px;}
.page-sub{color:var(--ink-soft);font-size:13.5px;margin-top:8px;max-width:64ch;}
.eyebrow{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.02em;margin-bottom:4px;}

/* ============ COMPONENTS ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-card);}
.card-pad{padding:20px 22px;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px;}
.card-head h3{font-size:15px;font-family:var(--font-display);font-weight:700;}
.card-head .hint{font-size:11.5px;color:var(--ink-faint);}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

.stat{padding:16px 18px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:6px;}
.stat .n{font-family:var(--font-display);font-size:27px;font-weight:800;letter-spacing:-.01em;}
.stat .l{font-size:12px;color:var(--ink-soft);font-weight:600;}
.stat .t{font-size:11px;color:var(--ink-faint);}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.badge .pdot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
.b-slate{background:var(--surface-2);color:var(--ink-faint);}
.b-accent{background:var(--accent-soft);color:var(--accent-ink);}
.b-warm{background:var(--warm-soft);color:var(--warm-ink);}
.b-success{background:var(--success-soft);color:var(--success);}
.b-warning{background:var(--warning-soft);color:var(--warning);}
.b-critical{background:var(--critical-soft);color:var(--critical);}
.b-info{background:var(--info-soft);color:var(--info);}
.ai-chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--warm-ink);background:var(--warm-soft);border:1px dashed var(--warm-line);padding:3px 9px 3px 7px;border-radius:20px;}
.bdr-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--warning);background:var(--warning-soft);border:1px dashed var(--warning);padding:3px 9px;border-radius:20px;cursor:help;}
.rbac-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.rbac-chip .pdot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}

.btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-body);font-weight:700;font-size:13px;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-ink);}
.btn-critical{background:var(--critical);border-color:var(--critical);color:#fff;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px;}
.btn[disabled]{opacity:1;cursor:not-allowed;background:var(--surface-2);color:var(--ink-faint);border-color:var(--line);}
.btn .lock{opacity:.8;}

.capbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:18px;}
.capbar .who{font-size:11.5px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-right:2px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;}
.tab{padding:10px 14px;font-size:13px;font-weight:700;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--accent);border-color:var(--accent);}

.stepper{display:flex;align-items:flex-start;gap:0;margin:6px 0 20px;overflow-x:auto;padding-bottom:6px;}
.step{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:78px;position:relative;cursor:pointer;flex:1;text-align:center;}
.step .dotc{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:11.5px;font-weight:800;border:2px solid var(--line-strong);background:var(--surface-2);color:var(--ink-faint);z-index:1;}
.step.done .dotc{background:var(--accent);border-color:var(--accent);color:#fff;}
.step.current .dotc{background:var(--surface);border-color:var(--accent);color:var(--accent);}
.step .line{position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line-strong);z-index:0;}
.step.done .line{background:var(--accent);}
.step:first-child .line{display:none;}
.step .lbl{font-size:10px;text-align:center;color:var(--ink-faint);line-height:1.25;max-width:86px;font-weight:600;}
.step.current .lbl{color:var(--ink);}
.step.done .lbl{color:var(--ink-soft);}

table.dt{font-size:13px;}
table.dt th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);padding:0 12px 10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap;}
table.dt td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;}
table.dt tr:last-child td{border-bottom:none;}
table.dt tbody tr.link:hover{background:var(--surface-2);cursor:pointer;}
.name-cell .primary{font-weight:700;color:var(--ink);}
.name-cell .secondary{font-size:11.5px;color:var(--ink-faint);}

.kv{display:grid;grid-template-columns:170px 1fr;gap:10px 14px;font-size:13px;}
.kv dt{color:var(--ink-faint);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding-top:2px;}
.kv dd{margin:0;color:var(--ink);}

.notepop{position:absolute;top:52px;right:26px;width:340px;max-height:70vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-pop);z-index:40;}
.notepop h4{padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--font-display);font-size:13px;font-weight:700;}
.note-item{padding:11px 16px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer;}
.note-item:hover{background:var(--surface-2);}
.note-item:last-child{border:none;}
.note-item .t{font-weight:700;margin-bottom:2px;}
.note-item .d{color:var(--ink-soft);}
.note-item .m{color:var(--ink-faint);font-size:11px;margin-top:4px;}

.callout{border-radius:var(--radius);padding:14px 16px;font-size:13px;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);}
.callout svg{margin-top:1px;flex:none;}
.callout b{display:block;font-size:13.5px;margin-bottom:2px;color:var(--ink);}
.callout.warm{background:var(--warm-soft);color:var(--warm-ink);}
.callout.info{background:var(--info-soft);color:var(--info);}
.callout.warning{background:var(--warning-soft);color:var(--warning);}

.empty{padding:40px 20px;text-align:center;color:var(--ink-faint);font-size:13px;}
.divider{height:1px;background:var(--line);margin:18px 0;}
.section-title{font-family:var(--font-display);font-size:17px;font-weight:800;margin:26px 0 12px;}
.section-title:first-child{margin-top:0;}
.subhead{font-family:var(--font-display);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:18px 0 8px;}
.subhead:first-child{margin-top:0;}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;}
.skill-chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);}
.skill-chip.match{background:var(--success-soft);color:var(--success);border-color:transparent;}
.skill-chip.missing{background:var(--critical-soft);color:var(--critical);border-color:transparent;}
.progress{height:7px;border-radius:5px;background:var(--surface-2);overflow:hidden;}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:5px;}
.tooltip-wrap{position:relative;display:inline-flex;}

/* ---- compact / progressive-disclosure components ---- */
.note-line{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-faint);margin:2px 0 14px;}

details.acc{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-card);}
details.acc>summary{list-style:none;cursor:pointer;padding:13px 18px;display:flex;align-items:center;gap:10px;font-size:13.5px;}
details.acc>summary::-webkit-details-marker{display:none;}
details.acc>summary:hover{background:var(--surface-2);}
details.acc>summary .chev{transition:transform .15s;color:var(--ink-faint);flex:none;width:14px;height:14px;}
details.acc[open]>summary .chev{transform:rotate(180deg);}
details.acc>summary .s-title{font-family:var(--font-display);font-weight:700;flex:none;}
details.acc>summary .s-sum{color:var(--ink-faint);font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
details.acc[open]>summary{border-bottom:1px solid var(--line);}
details.acc .acc-body{padding:18px;}

.perm-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.perm-group{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface-2);}
.perm-group.pg-edit{border-left:3px solid var(--accent);}
.perm-group.pg-approve{border-left:3px solid var(--warning);}
.perm-group.pg-view{border-left:3px solid var(--info);}
.perm-group.pg-none{border-left:3px solid var(--line-strong);opacity:.75;}
.perm-group h5{margin:0 0 8px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);display:flex;align-items:center;gap:6px;}
.perm-group h5 .pdot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--line-strong);}
.perm-group.pg-edit h5 .pdot{background:var(--accent);}
.perm-group.pg-approve h5 .pdot{background:var(--warning);}
.perm-group.pg-view h5 .pdot{background:var(--info);}
.perm-group ul{margin:0;padding-left:16px;font-size:12.5px;display:flex;flex-direction:column;gap:4px;}
.perm-group .empty-mini{font-size:12px;color:var(--ink-faint);font-style:italic;}
td.my-col{background:var(--accent-soft)!important;}
th.my-col{background:var(--accent-soft)!important;color:var(--accent-ink)!important;border-radius:6px 6px 0 0;}

footer.app-foot{padding:20px 28px 60px;color:var(--ink-faint);font-size:11.5px;max-width:640px;}

@media (max-width:880px){
  #app{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;flex-direction:row;flex-wrap:wrap;}
}
</style>
<div id="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <h1>Talent Workbench</h1>
      <div class="client-chip"><span class="dot"></span>Meridian Systems GCC</div>
      <div class="topbar-tools">
        <div class="role-pick">
          <label class="rp-label" for="roleSel">Viewing as <span class="info-dot" title="RM and Chief of Staff are equal-purpose engagement-management roles in this prototype and receive equivalent access (§8).">i</span></label>
          <select id="roleSel"></select>
        </div>
        <button class="icon-btn" id="notifBtn" title="Notifications" aria-label="Notifications">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 13 6 9Z"/><path d="M10 18a2.2 2.2 0 0 0 4 0"/></svg>
          <span class="dot-flag" id="notifDot"></span>
        </button>
        <div class="avatar" id="avatar">RM</div>
      </div>
    </div>
    <div class="crumbs" id="crumbs"></div>
    <div id="notifPanel" style="display:none;"></div>
    <div class="content" id="content"></div>
  </div>
</div>
<script>
/* =====================================================================
   TALENT WORKBENCH — interactive prototype
   Source: Dewdrop "Talent Module" Functional Requirements Document

const state = { role: "RM", notifOpen:false };

/* ---------- generic helpers ---------- */
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function money(n){ if(n==null) return "—"; return "₹" + n.toLocaleString("en-IN"); }
function grade(action){ const row = RBAC[action]; return row ? (row[state.role]||"-") : "-"; }
function rbacChip(action){
  const g = grade(action);
  return `<span class="rbac-chip ${GRADE_CLASS[g]}" title="RBAC §12 — ${esc(action)}"><span class="pdot"></span>${GRADE_LABEL[g]}</span>`;
}
/* Renders a button gated by the RBAC grade for `action`.
   E -> active button (primary look optional). A -> approve/reject pair. V -> disabled, locked. - -> not rendered. */
function actionButton(action, label, opts={}){
  const g = grade(action);
  if(g === "-") return "";
  if(g === "V"){
    return `<button class="btn btn-sm" disabled title="View only for ${esc(state.role)} — RBAC §12 grants View, not Edit, on &quot;${esc(action)}&quot;."><span class="lock">&#128274;</span> ${esc(label)}</button>`;
  }
  if(g === "A"){
    return `<span class="tooltip-wrap" title="Approval authority — exact hierarchy/order is Business Decision Required (§21).">
      <button class="btn btn-primary btn-sm" onclick="toast('${esc(label)} recorded (prototype — no persistence).')">&#10003; Approve</button>
      <button class="btn btn-sm" style="margin-left:6px;" onclick="toast('Rejection recorded (prototype — no persistence).')">Reject</button>
    </span>`;
  }
  return `<button class="btn ${opts.primary?'btn-primary':''} btn-sm" onclick="toast('${esc(label)} — action recorded (prototype — no persistence).')">${esc(label)}</button>`;
}
function capabilityBar(actions){
  const chips = actions.map(a=>{
    const g = grade(a);
    if(g==="-") return `<span class="rbac-chip b-slate" style="opacity:.55" title="RBAC §12"><span class="pdot"></span>No access — ${esc(a)}</span>`;
    return `<span class="rbac-chip ${GRADE_CLASS[g]}" title="RBAC §12"><span class="pdot"></span>${esc(a)}</span>`;
  }).join("");
  return `<div class="capbar"><span class="who">Viewing as ${esc(state.role)} —</span>${chips}</div>`;
}
function aiChip(label){ return `<span class="ai-chip">&#10024; ${esc(label||"AI-assisted · decision support")}</span>`; }
/* Compact info icon — full FRD guardrail language lives in the hover tooltip instead of a permanent paragraph on screen. */
function tip(text){ return `<span class="info-dot" title="${esc(text)}">i</span>`; }
/* Native <details> accordion — opens by default only when `open` is true, so a candidate/requisition page
   shows one glanceable line per section instead of every card's full text at once. */
function accordion(title, summary, bodyHtml, open){
  return `<details class="acc" ${open?"open":""}>
    <summary><svg class="icon chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg><span class="s-title">${esc(title)}</span><span class="s-sum">${esc(summary)}</span></summary>
    <div class="acc-body">${bodyHtml}</div>
  </details>`;
}
function bdrChip(key){
  const text = BDR[key] || key;
  return `<span class="bdr-chip" title="${esc(text)}">&#9873; Business Decision Required</span>`;
}
function stateBadge(s){
  const map = {
    "Draft":"b-slate","Pending Approval":"b-warning","Approved":"b-success","Rejected":"b-critical","Returned for Modification":"b-warning",
    "Fulfilled":"b-success","Withdrawn":"b-slate","Closed":"b-slate","Not Started":"b-slate","Pending Publication":"b-warning","Live":"b-success","Expired":"b-slate",
    "New":"b-info","Pending Duplicate Check":"b-warning","Unique":"b-success","Flagged - Possible Duplicate":"b-critical","Scored":"b-info",
    "Pending Screening":"b-warning","Screened":"b-info","Evaluated":"b-info","Shortlisted":"b-success","Not Shortlisted":"b-slate",
    "Interviewing":"b-warning","Interview Complete":"b-info","Pending Decision":"b-warning",
    "Offer Pending":"b-warning","Offer Accepted":"b-success","Offer Declined":"b-critical","Not Applicable":"b-slate",
  };
  return `<span class="badge ${map[s]||'b-slate'}"><span class="pdot"></span>${esc(s)}</span>`;
}
/* Location Intelligence (FRD Part II, §26.C) — compares the entered/approved budget against the
   Location Intelligence salary benchmark. The exact percentage bands are not defined in the FRD
   (bdrChip('competitivenessThresholds')); this illustrative ±3% margin exists only to produce a
   working demo signal. */
function competitivenessLabel(entered, benchmark){
  if(!benchmark) return {label:"Insufficient Data", cls:"b-slate"};
  const low = benchmark.min * 0.97, high = benchmark.max * 1.03;
  if(entered < low) return {label:"Below Market", cls:"b-warning"};
  if(entered > high) return {label:"Above Market", cls:"b-info"};
  return {label:"Around Market", cls:"b-success"};
}
/* Qualitative indicator badges for Location Intelligence signals (§25/§26). "Good" direction differs
   by signal type, so availability and difficulty each get their own polarity mapping. */
function availabilityBadgeClass(level){
  if(/^high/i.test(level)) return "b-success";
  if(/^moderate-low|^low/i.test(level)) return "b-critical";
  return "b-warning";
}
function difficultyBadgeClass(level){
  if(/^low/i.test(level)) return "b-success";
  if(/^high/i.test(level)) return "b-critical";
  return "b-warning";
}
function toast(msg){
  let t = document.getElementById("toastEl");
  if(!t){ t = document.createElement("div"); t.id="toastEl"; t.style.cssText="position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:30px;font-size:12.5px;z-index:100;box-shadow:var(--shadow-pop);opacity:0;transition:opacity .2s;"; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = "1";
  clearTimeout(window.__toastT); window.__toastT = setTimeout(()=>{ t.style.opacity="0"; }, 2200);
}

const REQ_TABS = [
  {key:"", label:"Workspace"},
  {key:"requirements", label:"Client Requirements"},
  {key:"market", label:"Market Intelligence"},
  {key:"jd", label:"JD & Budget"},
  {key:"approval", label:"Approval"},
  {key:"linkedin", label:"LinkedIn Post"},
  {key:"candidates", label:"Candidates"},
  {key:"shortlist", label:"Shortlist"},
  {key:"interviews", label:"Interviews"},
  {key:"decision", label:"Hiring Decisions"},
  {key:"offer", label:"Offer Acceptance"},
  {key:"closure", label:"Closure"},
];
function pageRequisition(id, tab){
  const r = reqOf(id);
  if(!r){ setCrumbs([{label:"Dashboard", href:"#/dashboard"},{label:"Requisitions", href:"#/requisitions"},{label:"Not found"}]); return `<div class="empty">Requisition ${esc(id)} not found.</div>`; }
  tab = tab || "";
  const tabDef = REQ_TABS.find(t=>t.key===tab) || REQ_TABS[0];
  setCrumbs([{label:"Dashboard", href:"#/dashboard"},{label:"Requisitions", href:"#/requisitions"},{label:r.title+" · "+r.id, href:"#/requisitions/"+r.id}, ...(tab?[{label:tabDef.label}]:[])]);

  const stepper = `<div class="stepper">${STAGES.map((s,i)=>{
    const cls = i<r.stageIdx?"done":(i===r.stageIdx?"current":"");
    return `<div class="step ${cls}" title="${esc(s.name)}" onclick="go('#/requisitions/${r.id}/${stageToTab(s.id)}')"><div class="line"></div><div class="dotc">${i<r.stageIdx?'&#10003;':s.n}</div><div class="lbl">${esc(s.name)}</div></div>`;
  }).join("")}</div>`;

  const tabsNav = `<div class="tabs">${REQ_TABS.map(t=>`<div class="tab ${t.key===tab?'active':''}" onclick="go('#/requisitions/${r.id}${t.key?'/'+t.key:''}')">${esc(t.label)}</div>`).join("")}</div>`;

  let body;
  switch(tab){
    case "requirements": body = tabRequirements(r); break;
    case "market": body = tabMarketIntel(r); break;
    case "jd": body = tabJD(r) + tabBudget(r); break;
    case "approval": body = tabApproval(r); break;
    case "linkedin": body = tabLinkedIn(r); break;
    case "candidates": body = tabReqCandidates(r); break;
    case "shortlist": body = tabShortlist(r); break;
    case "interviews": body = tabInterviews(r); break;
    case "decision": body = tabDecision(r); break;
    case "offer": body = tabOffer(r); break;
    case "closure": body = tabClosure(r); break;
    default: body = tabWorkspaceOverview(r);
  }

  return `
    <div class="page-head"><div>
      <div class="eyebrow mono">${r.id} · ${esc(r.dept)} · ${esc(r.location)}</div>
      <h1>${esc(r.title)}</h1>
      <div class="page-sub">Client: ${esc(r.client)} · Raised ${esc(r.raisedOn)} · Target timeline ${esc(r.targetTimeline)}</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">${stateBadge(r.reqStatus)}${stateBadge(r.postingStatus)}</div>
    </div>
    ${stepper}
    ${tabsNav}
    ${body}
  `;
}
function stageToTab(stageId){
  const map = {requirements:"requirements", jd:"jd", approval:"approval", linkedin:"linkedin", "li-approval":"linkedin", intake:"candidates", duplicate:"candidates", scoring:"candidates", screening:"candidates", "screen-eval":"candidates", shortlist:"shortlist", interviews:"interviews", decision:"decision", offer:"offer", closure:"closure"};
  return map[stageId]||"";
}

function stageCard(stageId){
  const s = STAGES.find(x=>x.id===stageId);
  return `<div class="card" style="margin-top:16px;">
    <div class="card-head"><h3>Stage ${s.n} — ${esc(s.name)}</h3><span class="hint">FRD §9</span></div>

        <dt>AI Action</dt><dd>${s.ai==="None."||s.ai==="None at this stage."||s.ai.startsWith("None")?esc(s.ai):`${aiChip()} ${esc(s.ai)}`}</dd>

}

/* FRD Part II — Location Intelligence → Talent Intelligence Integration (§24–34).
   Location Intelligence is a market-intelligence layer, not a location field provider or a source
   of actual candidates (§24.2); Talent consumes its outputs as decision support only — it never
   owns, duplicates, or silently overrides the location evaluation itself (§34). */
function tabMarketIntel(r){
  const li = r.locationIntel;
  if(!li){
    return `${capabilityBar(["View Location Intelligence Market Data"])}<div class="card"><div class="empty">Market intelligence has not been queried yet — this becomes available once the requisition reaches JD &amp; Budget (Stage 2), when role, experience band, city and domain are resolvable (§26, §29).</div></div>`;
  }
  return `
    ${capabilityBar(["View Location Intelligence Market Data"])}
    <div class="card" style="margin-bottom:14px;"><div class="card-head"><h3>Location Context${tip('Location Intelligence sits between Advisory and Talent in the intelligence chain: it evaluates location suitability and hands Talent a client-approved Location plus market intelligence. Talent references this context; it does not redefine it (§24, §25).')}</h3><span class="hint">Snapshot · ${esc(li.dataDate)}</span></div>
      <div class="card-pad">
        <div class="kv">
          <dt>Approved Location</dt><dd>${esc(r.location)} <span class="badge b-slate">Referenced from Advisory / Location Intelligence — not editable in Talent</span></dd>
          <dt>Selected Advisory Domain</dt><dd>${li.domain} ${bdrChip('domainTaxonomy')}</dd>
          <dt>Data Snapshot</dt><dd>Taken ${esc(li.dataDate)} at requisition/JD creation — an auditable snapshot, not a live feed (§30.1).</dd>
          <dt>Team Size / Scale Horizon${tip("The client's intended team size and scale-up horizon for the location, as captured by Advisory / Location Intelligence. Optional field — informs Workforce/Cost Planning (§26.J) and scale-related Hiring Market Risk flags (§26.H) where available. Reference only; not editable in Talent (§25).")}</dt><dd>${li.teamScaleHorizon ? `~${li.teamScaleHorizon.headcount} headcount over ${esc(li.teamScaleHorizon.horizon)} <div style="color:var(--ink-soft);font-weight:400;margin-top:2px;">${esc(li.teamScaleHorizon.note)}</div>` : `<span class="badge b-slate">Not provided by Advisory for this requisition</span> <span style="color:var(--ink-soft);">— optional field (§25)</span>`}</dd>
        </div>
        <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
          <button class="btn btn-sm" onclick="toast('Market intelligence refresh recorded (prototype — no persistence).')">Refresh Market Intelligence</button>
          ${bdrChip('refreshCadence')}
        </div>
        <div class="note-line" style="margin-top:10px;">${bdrChip('upstreamChangeWorkflow')}<span>Whether an upstream Advisory/Location Intelligence change after approval triggers re-approval or a budget re-review is not assumed here (§31).</span></div>
      </div>
    </div>

    <div class="grid grid-2" style="margin-bottom:14px;">
      <div class="card"><div class="card-head"><h3>Hiring Difficulty${tip('Uses Location Intelligence indicators — skill availability, domain ecosystem, graduate output, lateral mobility, and delivery readiness — as market-level hiring-difficulty intelligence. Market-level talent availability is permanently distinguished from actual candidates in the Talent pipeline (§26.D).')}</h3><span class="badge ${difficultyBadgeClass(li.hiringDifficulty.level)}"><span class="pdot"></span>${esc(li.hiringDifficulty.level)}</span></div>
        <div class="card-pad">
          <div class="kv">${li.hiringDifficulty.factors.map(f=>`<dt>${esc(f.label)}</dt><dd>${f.value}</dd>`).join("")}${li.deliveryReadiness?`<dt>Delivery Readiness${tip("Location Intelligence's assessment of the location's overall readiness to support delivery at the client's intended scale. Used in Hiring Market Risk (§26.H) and Location Reconsideration (§26.I).")}</dt><dd><span class="badge ${difficultyBadgeClass(li.deliveryReadiness.level)}"><span class="pdot"></span>${esc(li.deliveryReadiness.level)}</span><div style="color:var(--ink-soft);font-weight:400;margin-top:2px;">${esc(li.deliveryReadiness.note)}</div></dd>`:""}</div>
        </div>
      </div>
      <div class="card"><div class="card-head"><h3>Skill Availability${tip('Market intelligence for the requisition\'s required skills. Strong availability of individual skills must not be assumed to mean strong availability of the combined skill profile the requisition actually needs (§26.E).')}</h3></div>
        <div class="card-pad">
          <div class="kv">${li.skillAvailability.map(s=>`<dt>${esc(s.skill)}</dt><dd><span class="badge ${availabilityBadgeClass(s.level)}"><span class="pdot"></span>${esc(s.level)}</span></dd>`).join("")}</div>
          <div class="note-line" style="margin-top:10px;margin-bottom:0;">${bdrChip('roleSkillNormalization')}<span>Matching this requisition's free-text skills to Location Intelligence's taxonomy (§28).</span></div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:14px;"><div class="card-head"><h3>Sourcing Strategy${tip('Where sufficient data supports it, AI may suggest sourcing considerations. These remain advisory only and never replace Consultant/RM sourcing judgment (§26.F).')}</h3>${aiChip("AI-assisted · advisory only")}</div>
      <div class="card-pad">
        ${li.sourcingSuggestions.length ? `<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;">${li.sourcingSuggestions.map(s=>`<li>${s}</li>`).join("")}</ul>` : `<div class="empty" style="padding:14px;">No sourcing considerations flagged for this requisition.</div>`}

        ${li.locationReconsideration ? `<div class="callout warm"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21Z"/></svg><div><b>Location Reconsideration${tip('If Talent identifies a significant hiring-market constraint, the system may flag the issue and optionally recommend the location be reviewed. Talent must NOT independently change the approved location — any change follows the Advisory / Location Intelligence approval flow (§26.I, §31).')}</b>${li.locationReconsideration.text}</div></div>` : ""}
      </div>
    </div>
    <div class="note-line" style="margin-top:10px;">${bdrChip('benchmarkVisibility')}<span>Client sees a derived competitiveness label only, not the underlying benchmark figures, per RBAC §12 (V*).</span></div>

  `;
}

function noteBlock(notes){
  const visible = notes.filter(n => state.role==="RM" ? true : state.role==="Consultant" ? n.author==="Consultant" : false);
  return `<div class="card" style="margin-top:14px;">
    <div class="card-head"><h3>Restricted Internal Notes</h3><span class="hint">Consultant/RM only — never exposed to Client, Executive Sponsor, or Chief of Staff by default</span></div>
    <div class="card-pad">
      ${visible.length? visible.map(n=>`<div style="margin-bottom:8px;"><span class="badge b-slate">${esc(n.author)}</span> ${esc(n.text)}</div>`).join("") : `<div class="empty" style="padding:14px;">${state.role} has no default access to restricted internal notes (RBAC §12/§19).</div>`}
    </div>
  </div>`;
}

function tabLinkedIn(r){
  const li = r.linkedin;
  if(!li || li.status==="Not Started"){
    return `${capabilityBar(["Create / Edit LinkedIn Post"])}<div class="card"><div class="empty">LinkedIn post creation begins once the Requisition is Approved (Stage 4). Not yet started.</div></div>`;
  }
  return `
    ${capabilityBar(["Create / Edit LinkedIn Post","Approve LinkedIn Post*"])}
    <div class="card">
      <div class="card-head"><h3>LinkedIn Post — 6S-owned account${tip('Always published from the 6S-owned account, never an individual\'s personal account. A failed publish is flagged for retry rather than failing silently (§10.5). Exact publish mechanism — API vs. manual publish-and-confirm — is Business Decision Required (§22).')}</h3>${stateBadge(li.status)}</div>
      <div class="card-pad">
        <div class="note-line">${aiChip("AI-generated, JD-derived draft")}<span>Editable before submission; requires approval before it goes live.</span></div>
        <div class="subhead">Post Draft</div>

        ${li.status==="Pending Publication"?`<div style="margin-top:14px;">${actionButton("Approve LinkedIn Post*","Approve & Publish")}</div>`:""}

}

}

function skillChips(list, cls){ return `<div class="pill-row">${list.map(s=>`<span class="skill-chip ${cls}">${esc(s)}</span>`).join("")||'<span style="color:var(--ink-faint);font-size:12px;">None</span>'}</div>`; }

function pageCandidate(id){
  const c = candOf(id);
  if(!c){ setCrumbs([{label:"Dashboard",href:"#/dashboard"},{label:"Candidates",href:"#/candidates"},{label:"Not found"}]); return `<div class="empty">Candidate ${esc(id)} not found.</div>`; }
  const r = reqOf(c.reqId);
  setCrumbs([{label:"Dashboard",href:"#/dashboard"},{label:"Candidates",href:"#/candidates"},{label:c.name}]);

  // Which single section should already be expanded — the one matching where this
  // candidate actually sits in the pipeline right now. Everything earlier collapses
  // to a one-line summary; nothing later has content yet.
  const openKey = c.offer && c.offer!=="Not Applicable" ? "offer"
    : c.decision ? "decision"
    : (c.interviews && c.interviews.length) ? "interviews"
    : c.screening ? "screening"
    : c.score ? "score" : "";

  const snapshot = [
    c.score ? {n:c.score.value+"/100", l:"Resume/JD Score"} : null,
    c.screening ? {n:c.screening.status, l:"Screening"} : null,
    (c.interviews&&c.interviews.length) ? {n:c.interviews.length, l:"Interview Round(s)"} : null,
    c.decision ? {n:c.decision.status, l:"Hiring Decision"} : null,
    (c.offer&&c.offer!=="Not Applicable") ? {n:c.offer, l:"Offer Acceptance"} : null,
  ].filter(Boolean);

  return `
    <div class="page-head"><div>
      <div class="eyebrow mono">${c.id} · applied via ${esc(c.source)} on ${esc(c.appliedOn)}</div>
      <h1>${esc(c.name)}</h1>
      <div class="page-sub">Applying for <a onclick="go('#/requisitions/${r.id}')" style="color:var(--accent-ink);font-weight:600;">${esc(r.title)}</a> · ${esc(r.location)} · <span class="mono">${r.id}</span></div>
    </div>${stateBadge(c.state)}</div>
    ${capabilityBar(["View Candidate Pipeline","View Duplicate Flags","View Resume vs. JD Score","Generate / Edit Screening Questions","View Screening Evaluation","Record Interview Evaluation","Approve / Reject Hiring Decision*","Update Offer Acceptance Status"])}

    ${snapshot.length ? `<div class="grid" style="grid-template-columns:repeat(${snapshot.length},1fr);margin-bottom:16px;">
      ${snapshot.map(s=>`<div class="stat"><div class="n" style="font-size:16px;">${esc(String(s.n))}</div><div class="l">${esc(s.l)}</div></div>`).join("")}
    </div>` : ""}

    ${c.duplicate ? `<div class="callout ${c.duplicate.resolved?'info':'warning'}" style="margin-bottom:16px;"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 4.5a7 7 0 0 0-10.6 9M6.5 19.5a7 7 0 0 0 10.6-9"/><path d="M6.5 4.5v4.5H11M17.5 19.5V15H13"/></svg><div><b>Duplicate Detection${tip('A duplicate flag never silently deletes or merges a candidate record — human review is required to confirm or dismiss it (§10.6). Exact matching rules: Business Decision Required.')}</b>${esc(c.duplicate.reason)} ${c.duplicate.possibleMatch?`Possible match: <a onclick="go('#/candidates/${esc(c.duplicate.possibleMatch.split(' ')[0])}')" style="font-weight:600;color:inherit;text-decoration:underline;">${esc(c.duplicate.possibleMatch)}</a>.`:""}</div></div>` : ""}

    ${c.score ? (grade("View Resume vs. JD Score")==="-" ? accordion("Resume vs. JD Score", "Restricted", `
        <div class="empty">${esc(state.role)} does not have access to Resume vs. JD Score under RBAC §12.</div>
      `, false) : accordion("Resume vs. JD Score", `${c.score.value}/100 — ${c.score.matched.length} matched, ${c.score.missing.length} missing`, `
        <div class="note-line">${aiChip("AI-assisted · decision support")}<span>Explainable evidence, never presented as objective or bias-free (§10.7).</span></div>
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;">
          <div class="mono" style="font-size:32px;font-weight:600;">${c.score.value}<span style="font-size:14px;color:var(--ink-faint);">/100</span></div>
          <div class="progress" style="flex:1;"><i style="width:${c.score.value}%;"></i></div>
        </div>
        <div class="grid grid-2">
          <div><div class="subhead">Matched Skills</div>${skillChips(c.score.matched,'match')}</div>
          <div><div class="subhead">Missing Skills</div>${skillChips(c.score.missing,'missing')}</div>
        </div>
        <div class="subhead" style="margin-top:14px;">Explanation</div>
        <p style="color:var(--ink-soft);">${esc(c.score.explanation)}</p>
        <div style="margin-top:12px;">${actionButton("View Resume vs. JD Score","Override score")}</div>
      `, openKey==="score")) : `<div class="card" style="margin-bottom:10px;"><div class="empty">Not yet scored — pending duplicate resolution or resume submission.</div></div>`}

    ${c.screening ? ((grade("Generate / Edit Screening Questions")==="-" && grade("View Screening Evaluation")==="-") ? accordion("Screening", "Restricted", `
        <div class="empty">${esc(state.role)} does not have access to Screening questions or evaluation under RBAC §12.</div>
      `, false) : accordion("Screening", c.screening.evalSummary ? c.screening.evalSummary : c.screening.status, `
        ${c.screening.questions ? `<div class="subhead">Screening Questions ${aiChip('AI-generated, reviewer-editable')}</div>
        <ul style="margin:0 0 14px;padding-left:18px;">${c.screening.questions.map(q=>`<li style="margin-bottom:4px;">${esc(q)}</li>`).join("")}</ul>` : ""}
        ${c.screening.evalSummary ? `<div class="subhead">Screening Evaluation ${tip('Generated questions, candidate responses, transcript, recording and AI evaluation are stored as distinct, separately labeled elements — never merged into one record (§10.8).')}</div><div class="note-line">${aiChip('AI evaluation support')}<span>${esc(c.screening.evalSummary)}</span></div>` : `<div class="empty">Awaiting screening session.</div>`}
      `, openKey==="screening")) : ""}

    ${c.interviews && c.interviews.length ? accordion("Interviews", c.interviews.map(iv=>`${iv.type.replace(' Round','')}: ${iv.outcome!=="—"?iv.outcome:iv.status}`).join(" · "), `
        <div class="scrollx"><table class="dt">
          <tr><th>Round</th><th>Participants</th><th>Status</th><th>Outcome</th><th>Notes</th></tr>
          ${c.interviews.map(iv=>`<tr><td>${esc(iv.type)}</td><td>${esc(iv.participants)}</td><td>${stateBadge(iv.status==="Completed"?"Interview Complete":"Interviewing")}</td><td>${esc(iv.outcome)}</td><td>${esc(iv.notes||"—")}</td></tr>`).join("")}
        </table></div>
      `, openKey==="interviews") : ""}

    ${c.decision ? accordion("Hiring Decision", `${c.decision.status}${c.decision.by?' — '+c.decision.by:''}`, `
        <div class="kv">
          <dt>Decision-Maker</dt><dd>${esc(c.decision.by||"—")}</dd>
          <dt>Date</dt><dd class="mono">${esc(c.decision.date||"—")}</dd>
          <dt>Reason / Comments</dt><dd>${esc(c.decision.reason||"—")}</dd>
        </div>
        <div class="note-line" style="margin-top:10px;margin-bottom:0;">${tip('AI never makes or influences the final hiring decision (§10.11, §17).')}<span>Human decision-maker only. ${bdrChip('approvalHierarchy')}</span></div>
      `, openKey==="decision") : ""}

    ${c.offer && c.offer!=="Not Applicable" ? accordion("Offer Acceptance Status", c.offer+(c.offerDate?" — "+c.offerDate:""), `
        <div class="kv"><dt>Status Date</dt><dd class="mono">${esc(c.offerDate||"—")}</dd></div>
        <div class="note-line" style="margin-top:10px;margin-bottom:0;">${tip('Talent tracks acceptance status only — it does not generate, issue, send, or negotiate the offer itself (out of scope, §7, §10.12).')}<span>Status tracking only — offer roll-out is out of scope.</span></div>
      `, openKey==="offer") : ""}

    ${c.notes && c.notes.length ? noteBlock(c.notes) : ""}
  `;
}

/* =====================================================================
   APPROVALS QUEUE (Section 10.4, 11, 12 — cross-cutting)
   ===================================================================== */
function pageApprovals(){
  setCrumbs([{label:"Dashboard", href:"#/dashboard"}, {label:"Approvals"}]);
  const reqPending = REQS.filter(r=>r.reqStatus==="Pending Approval");
  const jdPending = REQS.filter(r=>r.jdStatus==="Pending Approval" && r.reqStatus!=="Pending Approval");
  const liPending = REQS.filter(r=>r.linkedin && r.linkedin.status==="Pending Publication");
  const decisionPending = CANDIDATES.filter(c=>c.decision && c.decision.status==="Pending Decision");
  return `
    <div class="page-head"><div>
      <div class="eyebrow">Approval Gates · §10.4, §12</div>
      <h1>Approvals</h1>
      <div class="page-sub">Every gate below requires an authorized human action — AI never approves on its own behalf. Exact approval hierarchy and escalation thresholds are ${bdrChip('approvalHierarchy')}.</div>
    </div></div>
    ${capabilityBar(["Approve Requisition*","Approve JD*","Approve LinkedIn Post*","Approve / Reject Hiring Decision*"])}

    <div class="card" style="margin-bottom:14px;"><div class="card-head"><h3>Requisition Approvals</h3><span class="hint">${reqPending.length} pending</span></div>
      ${reqPending.length? `<div class="scrollx"><table class="dt"><tr><th>Requisition</th><th>Location</th><th>Raised</th><th></th></tr>
        ${reqPending.map(r=>`<tr class="link" onclick="go('#/requisitions/${r.id}/approval')"><td class="name-cell"><div class="primary">${esc(r.title)}</div><div class="secondary mono">${r.id}</div></td><td>${esc(r.location)}</td><td class="mono">${esc(r.raisedOn)}</td><td>${actionButton("Approve Requisition*","Approve")}</td></tr>`).join("")}

/* =====================================================================
   ROUTER
   ===================================================================== */
function parseHash(){
  const h = (location.hash || "#/dashboard").replace(/^#\/?/, "");
  return h.split("/").filter(Boolean).map(decodeURIComponent);
}
function render(){
  const parts = parseHash();
  const root = parts[0] || "dashboard";
  let html = "", activeNav = root;

  try{
    switch(root){
      case "dashboard": html = pageDashboard(); break;
      case "overview": html = pageOverview(); break;
      case "roles": html = pageRoles(); break;
      case "requisitions":
        html = parts[1] ? pageRequisition(parts[1], parts[2]) : pageRequisitionsList();
        break;
      case "candidates":
        html = parts[1] ? pageCandidate(parts[1]) : pageCandidatesList();
        break;
      case "postings":
        html = parts[1] ? pagePosting(parts[1]) : pagePostingsList();
        break;
      case "approvals": html = pageApprovals(); break;
      case "audit": html = pageAudit(); break;
      default: html = pageDashboard(); activeNav = "dashboard";
    }
  }catch(err){
    html = `<div class="card"><div class="empty">Something went wrong rendering this view.<br><span class="mono" style="font-size:11px;">${esc(err.message)}</span></div></div>`;
    console.error(err);
  }

  document.getElementById("content").innerHTML = html;
  renderSidebar(activeNav);
  window.scrollTo(0,0);
}

window.addEventListener("hashchange", render);
renderRoleSelect();
if(!location.hash) location.hash = "#/dashboard";
render();
</script>
